[project]
name = "crocodile"
version = "0.3.0"
description = "Deterministic market-data engine for crypto and US equities: ingest, normalize, store, replay."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
# Grounded in what the engine actually does. Nothing aspirational: every term below
# names a surface, a format or a source that exists in this tree today.
keywords = [
    "market-data",
    "crypto",
    "cryptocurrency",
    "equities",
    "stock-market",
    "order-book",
    "parquet",
    "duckdb",
    "polars",
    "replay",
    "determinism",
    "provenance",
    "mcp",
    "ccxt",
    "websocket",
    "sec-edgar",
    "defi",
    "quantitative-finance",
    "time-series",
    "data-engineering",
]
dependencies = [
    "msgspec>=0.18",
    "polars>=1.0",
    "pyarrow>=16",
    "duckdb>=1.0",
    "websockets>=12",
    "aiohttp>=3.9",
    "typer>=0.12",
    "rich>=13",
    "mmh3>=5.2.1",
    "numpy>=1.26",
    "prompt-toolkit>=3.0.52",
    # Equity-side base dependencies. yfinance is not optional: the reference
    # master and several providers import it at module level.
    "yfinance>=1.4.1",
    # Declared explicitly rather than inherited through yfinance, which the
    # equity code type-hints against — a latent break the day yfinance drops it.
    "pandas>=2.0",
    "beautifulsoup4>=4.12",
    "python-dateutil>=2.9",
]

[project.optional-dependencies]
ml = [
    "xgboost>=1.7.0",
    "scipy>=1.10.0",
    # Was in the deleted `gui` extra, which is where it never belonged: the only
    # consumer is `crypto/analytics/volsurface_3d.py`, which calls
    # `matplotlib.use("Agg")` before importing pyplot. That is a headless raster
    # backend — no Qt, no window, no display. It shipped beside PyQt6 because the
    # desktop layer arrived first, and deleting that layer without moving this
    # would have taken `plot_volsurface_3d` down with it in silence.
    "matplotlib>=3.7.0",
]
web = [
    "fastapi>=0.100.0",
    "uvicorn>=0.20.0",
    "streamlit>=1.58.0",
    "crocodile[onchain]",
]
onchain = [
    "web3>=6.0.0",
]
market = [
    # Universal multi-exchange venue set: 100+ CEXes via ccxt's unified API
    # (ccxt bundles ccxt.pro for WebSocket streaming, so no separate dep).
    "ccxt>=4.5",
]
evasion = [
    # Deliberately empty. crocodile.contrib.evasion is stdlib-only, so this extra
    # buys no packages — it exists to make routing around a source's access
    # controls something a deployment has to ask for by name. Left out of `full`
    # on purpose: the default posture is to respect quotas, not to evade them.
]
full = [
    "crocodile[ml,web,onchain,market]",
]


[project.scripts]
# One command for both asset classes, projected from the capability registry.
# `crocodile-equity` is gone: it existed because there were two engines, and a
# command whose whole meaning was "the other fork" has nothing left to name.
# Every capability that serves equities is reachable here under the same name it
# has for crypto, with `--asset-class equity` when the symbol does not say.
crocodile        = "crocodile.surfaces.entrypoint:main"
# The two old names stay callable for one minor version, through wrappers that
# say so on stderr. Pointing them straight at `main` would have made them silent
# aliases — the deprecation notice would exist only in this comment.
crypcodile       = "crocodile._deprecated_cli:crypcodile_main"   # removed in 0.4
stockodile       = "crocodile._deprecated_cli:stockodile_main"   # removed in 0.4

[dependency-groups]
dev = [
    "eth-account>=0.13",  # imported directly by tests/equity/test_api_payment_security.py
    "httpx>=0.27",  # required by starlette TestClient for API endpoint tests
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5",
    "pytest-timeout>=2",
    "ruff>=0.6",
    "mypy>=1.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/crocodile", "src/crypcodile", "src/stockodile"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
timeout = 120
timeout_method = "thread"

[tool.ruff]
line-length = 100
src = ["src", "tests"]
[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "RUF"]
[tool.ruff.lint.per-file-ignores]
# census.py embeds a self-contained HTML/CSS dashboard template as a string
# literal; its markup lines legitimately exceed the 100-col limit.
"src/crocodile/crypto/census.py" = ["E501"]

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
packages = ["crocodile"]
strict = true
ignore_missing_imports = true

# Before the rename, `mypy --strict -p crocodile` covered only what the merge
# had built — 56 files, clean, and a real gate. After it, `crocodile` IS the
# whole product: 217 files carrying 334 strict errors inherited from two
# surfaces that were never strict-clean under their old names, where mypy had
# never been pointed at them at all.
#
# Silently dropping `strict` would have made the gate meaningless everywhere.
# Instead the debt is named here and nowhere else: `core` and `contrib` — every
# line the merge actually wrote — stay strict, and the two legacy surfaces are
# exempt until Phase 2 migrates them. The list only ever shrinks: a module comes
# off it when it type-checks, never goes on it to silence a new error.
[[tool.mypy.overrides]]
module = ["crocodile.crypto.*", "crocodile.equity.*"]
ignore_errors = true

[[tool.mypy.overrides]]
module = ["crocodile.crypto.exchanges.binance.book_session", "crocodile.crypto.exchanges.binance.replay", "crocodile.crypto.exchanges.binance.sbe", "crocodile.crypto.exchanges.binance.normalize_sbe", "crocodile.crypto.exchanges.deribit.book", "crocodile.crypto.exchanges.deribit.session", "crocodile.crypto.exchanges.deribit.replay"]
ignore_errors = false

[tool.hatch.build]
exclude = [
  "/.venv",
  "/.uv-cache",
  "/.agents",
  "/dist",
  "/bin",
  "/.git",
  "/.mypy_cache",
  "/.ruff_cache",
  "/.pytest_cache",
  "/tmp",
  "/tmp_test_run",
  "/verify_cli_robustness.py",
  "/test_failures.txt",
  "/test_out.txt",
  "/test_run_details.txt",
  "/uv",
]

[tool.maturin]
python-source = "src"
manifest-path = "src/crocodile/crypto/log_decoder/Cargo.toml"
module-name = "crocodile.crypto.log_decoder._rust_decoder"
features = ["pyo3/extension-module"]
